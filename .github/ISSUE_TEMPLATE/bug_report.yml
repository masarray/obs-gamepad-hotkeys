name: Bug report
description: Report a reproducible problem with OBS Gamepad Hotkeys
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough detail for someone else to reproduce it without guessing.

        For suspected security vulnerabilities, do **not** use this form. Follow `SECURITY.md` instead.

  - type: input
    id: plugin-version
    attributes:
      label: OBS Gamepad Hotkeys version
      description: Example: v0.1.6
      placeholder: v0.1.6
    validations:
      required: true

  - type: input
    id: obs-version
    attributes:
      label: OBS Studio version
      placeholder: 31.1.1
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: controller
    attributes:
      label: Controller
      description: Brand/model and XInput or DirectInput if known
      placeholder: Xbox Wireless Controller / XInput
    validations:
      required: true

  - type: dropdown
    id: ui-visible
    attributes:
      label: Does Tools → Gamepad Hotkeys appear in OBS?
      options:
        - "Yes"
        - "No"
    validations:
      required: true

  - type: dropdown
    id: listen-detects
    attributes:
      label: Does Listen detect the controller button?
      options:
        - "Yes"
        - "No"
        - "Not tested"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Number the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Open OBS
        2. Open Tools → Gamepad Hotkeys
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant OBS log or screenshots
      description: Optional. Remove unrelated private paths, credentials, or personal information before posting.

  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I downloaded the plugin from this repository's official GitHub Releases or official landing page.
          required: true
        - label: This report does not contain passwords, certificates, private keys, credentials, or vulnerability exploit details.
          required: true
