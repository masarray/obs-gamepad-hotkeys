name: Windows Smart Installer

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: smart-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  BUILD_PRESET: windows-x64
  ARTIFACT_NAME: obs-gamepad-hotkeys-windows-x64

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static project checks
        run: python3 tools/static-check.py

      - name: Validate JSON metadata
        run: |
          python3 - <<'PY'
          import json
          for name in ('buildspec.json', 'CMakePresets.json'):
              with open(name, encoding='utf-8') as f:
                  json.load(f)
              print(f'OK: {name}')
          PY

  build-installer:
    name: Build Windows x64 installer
    needs: validate
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -property installationVersion
          } else {
            Write-Host 'vswhere.exe not found at the standard path; continuing because the actual build script performs its own toolchain validation.'
          }

      - name: Fetch official OBS plugin build support
        shell: pwsh
        run: ./scripts/bootstrap-template.ps1

      - name: Configure plugin
        shell: pwsh
        run: cmake --preset $env:BUILD_PRESET

      - name: Build plugin
        shell: pwsh
        run: cmake --build --preset $env:BUILD_PRESET

      - name: Sign plugin DLL when certificate is configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $dll = Get-ChildItem build_x64 -Filter obs-gamepad-hotkeys.dll -Recurse -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $dll) { throw 'Plugin DLL not found.' }
          ./scripts/sign-windows.ps1 -Files $dll.FullName

      - name: Package manual plugin ZIP
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Build smart installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_BASE64 || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: ./scripts/build-installer.ps1 -SkipBuild

      - name: Refresh SHA-256 files
        shell: pwsh
        run: ./scripts/write-checksums.ps1 -Path dist

      - name: Validate release files
        shell: pwsh
        run: |
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          $installer = "dist/OBS-Gamepad-Hotkeys-Setup-v$version.exe"
          $zip = "dist/obs-gamepad-hotkeys-$version-windows-x64.zip"
          $required = @($installer, $zip, "$installer.sha256", "$zip.sha256")
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
          }

          Write-Host 'Release files:'
          Get-ChildItem dist -File | Sort-Object Name | Format-Table Name, Length

          "### Windows Smart Installer" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "Build completed successfully for **v$version**." >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "For normal users, distribute **OBS-Gamepad-Hotkeys-Setup-v$version.exe**." >> $env:GITHUB_STEP_SUMMARY
          "The ZIP is kept as a manual/fallback installation package." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
    needs: build-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download signed Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - name: Verify SHA-256 manifests
        working-directory: dist
        run: |
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            release_mode='existing-tag'
          else
            version="$(python3 -c "import json; print(json.load(open('buildspec.json', encoding='utf-8'))['version'])")"
            tag="v${version}"
            release_mode='create-tag-from-main'
          fi

          title="OBS Gamepad Hotkeys ${tag}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --latest
          elif [[ "$release_mode" == 'existing-tag' ]]; then
            gh release create "$tag" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$title" \
              --latest
          else
            gh release create "$tag" dist/* \
              --target "${GITHUB_SHA}" \
              --generate-notes \
              --title "$title" \
              --latest
          fi

      - name: Release summary
        run: |
          echo '### Release published' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Normal users should download the **Setup EXE** from the GitHub Release.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The installer auto-detects standard OBS Studio and supports OBS Portable.' >> "$GITHUB_STEP_SUMMARY"
