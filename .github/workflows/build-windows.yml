name: Build Windows Installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          & "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion

      - name: Fetch official OBS plugin build support
        shell: pwsh
        run: ./scripts/bootstrap-template.ps1

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-x64

      - name: Build plugin
        shell: pwsh
        run: cmake --build --preset windows-x64

      - name: Sign plugin DLL when certificate is configured
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $dll = Get-ChildItem build_x64 -Filter obs-gamepad-hotkeys.dll -Recurse -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dll) { throw 'Plugin DLL not found.' }
          ./scripts/sign-windows.ps1 -Files $dll.FullName

      - name: Package plugin ZIP
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Build smart installer (pull request)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipBuild

      - name: Build smart installer (push or manual)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/build-installer.ps1 -SkipBuild

      - name: Refresh SHA-256 files
        shell: pwsh
        run: ./scripts/write-checksums.ps1 -Path dist

      - name: Validate artifacts
        shell: pwsh
        run: |
          $version = (Get-Content buildspec.json -Raw | ConvertFrom-Json).version
          $installer = "dist/OBS-Gamepad-Hotkeys-Setup-v$version.exe"
          $zip = "dist/obs-gamepad-hotkeys-$version-windows-x64.zip"
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          if (-not (Test-Path $zip)) { throw "Missing ZIP: $zip" }
          Get-ChildItem dist -File | Format-Table Name, Length

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obs-gamepad-hotkeys-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip', '.sha256' }
          if (-not $assets) { throw 'No release assets found.' }
          & gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $args = @('release', 'upload', $tag, '--clobber')
            $args += $assets.FullName
            & gh @args
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release asset upload failed.' }
          }
          else {
            $args = @('release', 'create', $tag, '--verify-tag', '--generate-notes', '--title', "OBS Gamepad Hotkeys $tag")
            $args += $assets.FullName
            & gh @args
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
          }
